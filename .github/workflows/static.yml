name: Deploy BhiduAI Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare portfolio
        run: |
          mkdir public
          cp -r Portfolio/* public/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
